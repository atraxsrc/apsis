[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/atraxsrc/apsis"

[workspace.dependencies]
apsis-core = { path = "crates/apsis-core" }
futures-util = "0.3"
i18n-embed-fl = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std"] }
rust-embed = "8.11"
# File-level restore: openat/mkdirat with O_NOFOLLOW, fchown/fchmod through a held folder.
rustix = { version = "1", features = ["fs", "process"] }
# Timeshift's config: `preserve_order` keeps its fields in the order they were read.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.52.0", features = ["full"] }
xdgen = "0.1"
# The same zbus libcosmic uses; async on tokio (the applet's and the helper's runtime).
zbus = { version = "5.15", default-features = false, features = ["tokio"] }

[workspace.dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Detached process spawning (`cosmic-settings panel`, `xdg-open`)
    "process",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
