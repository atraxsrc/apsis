<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Bus policy for apsis-helper. Installed by `just install` to /usr/share/dbus-1/system.d/.

  Only root may own the name. Anyone may call the helper's interface, because the real check
  is polkit, inside each method (io.github.atraxsrc.Apsis.list / .create / .delete).
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.atraxsrc.Apsis.Helper"/>
    <allow send_destination="io.github.atraxsrc.Apsis.Helper"/>
    <!-- Finished(op, ok, message), sent only to the caller that started the operation. -->
    <allow send_type="signal" send_interface="io.github.atraxsrc.Apsis.Helper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.atraxsrc.Apsis.Helper"
           send_interface="io.github.atraxsrc.Apsis.Helper1"/>
    <allow send_destination="io.github.atraxsrc.Apsis.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.atraxsrc.Apsis.Helper"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.atraxsrc.Apsis.Helper"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
