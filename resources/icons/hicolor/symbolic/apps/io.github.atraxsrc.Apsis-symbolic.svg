<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Single colour on purpose: COSMIC recolours symbolic icons to match the theme. -->
  <!-- Orbit ring (gap cut at the apoapsis), hollow apoapsis, filled periapsis. -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-8" y="-8" width="32" height="32">
      <rect x="-8" y="-8" width="32" height="32" fill="#fff"/>
      <circle cx="13.4" cy="8" r="2.3" fill="#000"/>
    </mask>
  </defs>
  <path fill="#000000" fill-rule="evenodd" transform="rotate(-32 8 8)" mask="url(#gap)" d="
    M 2.1 8 a 5.9 3.4 0 1 0 11.8 0 a 5.9 3.4 0 1 0 -11.8 0 z
    M 3.1 8 a 4.9 2.4 0 1 0 9.8 0 a 4.9 2.4 0 1 0 -9.8 0 z"/>
  <circle cx="12.58" cy="5.14" r="1.55" fill="none" stroke="#000000" stroke-width="1"/>
  <circle cx="3.42" cy="10.86" r="2" fill="#000000"/>
</svg>
