[package]
name = "apsis-helper"
description = "Root D-Bus service that takes and deletes snapshots for Apsis, guarded by polkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apsis-helper"
path = "src/main.rs"

[dependencies]
apsis-core.workspace = true
futures-util.workspace = true
rustix.workspace = true
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
# Dev only (the LUKS restore spike), see apsis-core's feature of the same name and
# `src/luks_spike.rs`. Built only by `just deb-luks-spike`.
luks-spike = ["apsis-core/luks-spike"]
