[package]
name = "apsis-core"
description = "Snapshot model, rsync backend and config for Apsis (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
# Local time for a native snapshot's name (`native`), as Timeshift names them.
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }
rustix.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
thiserror.workspace = true
zbus.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[features]
# Dev only (the LUKS restore spike): `restore::refusal::check` lets `/` on dm-crypt or LVM
# through. Off by default and never in a release build: nothing in the workspace turns it on,
# and `just deb` refuses a helper built with it (see `just deb-luks-spike`).
luks-spike = []
